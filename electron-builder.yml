appId: vn.electricalstudio.app
productName: Electrical Studio
directories:
  output: release
  buildResources: desktop
files:
  - dist/**/*
  - desktop/main.cjs
  - desktop/icon.png
  - '!node_modules/**/*'
asar: true
npmRebuild: false
win:
  icon: desktop/icon.ico
  target:
    - target: portable
      arch: [x64]
portable:
  artifactName: Electrical-Studio-${version}-Windows-x64.exe
  requestExecutionLevel: user
  unpackDirName: false
