appId: vn.electricalstudio.app
productName: Electrical Studio
directories:
  output: release
  buildResources: desktop
files:
  - dist/**/*
  - desktop/*.cjs
  - '!desktop/*.test.cjs'
  - desktop/icon.png
asar: true
npmRebuild: false
win:
  icon: desktop/icon.ico
  target:
    - target: nsis
      arch: [x64]
nsis:
  artifactName: Electrical-Studio-Setup-${version}-x64.exe
  oneClick: true
  perMachine: false
  createDesktopShortcut: true
  deleteAppDataOnUninstall: false
publish:
  provider: github
  owner: Nguyendal21
  repo: electrical-studio
  releaseType: release
portable:
  artifactName: Electrical-Studio-${version}-Windows-x64.exe
  requestExecutionLevel: user
  unpackDirName: false
